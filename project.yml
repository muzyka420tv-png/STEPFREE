name: StepGenerator
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
targets:
  StepGenerator:
    type: application
    platform: iOS
    sources:
      - StepGeneratorApp.swift
    info:
      path: Info.plist
    entitlements:
      path: StepGenerator.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.stepgenerator
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
