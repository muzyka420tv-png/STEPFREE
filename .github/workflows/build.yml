name: Build IPA
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Compile SwiftUI app without Xcode project
        run: |
          xcrun --sdk iphoneos swiftc -target arm64-apple-ios17.0 \
            -parse-as-library \
            -framework SwiftUI \
            -framework HealthKit \
            -o StepGenerator \
            StepGeneratorApp.swift
          mkdir -p Payload/StepGenerator.app
          cp StepGenerator Payload/StepGenerator.app/
          cp Info.plist Payload/StepGenerator.app/
          echo "APPL????" > Payload/StepGenerator.app/PkgInfo
          chmod +x Payload/StepGenerator.app/StepGenerator
          cd Payload
          zip -r ../StepGenerator.ipa .
          cd ..
      - uses: actions/upload-artifact@v4
        with:
          name: StepGenerator-IPA
          path: StepGenerator.ipa
